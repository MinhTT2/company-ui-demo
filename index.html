<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E47E5" />
    <meta
      name="description"
      content="Company UI — a considered design system. Explore accessible components, CSS tokens, and patterns built around cobalt blue."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Company UI — Designed to work together</title>
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('company-ui-theme');
        } catch {}
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

  </body>
</html>
